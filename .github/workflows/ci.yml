name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      # ruff format --check сознательно не включён: одномоментный реформат
      # затронул бы 73 файла и гарантировал конфликты с открытыми ветками.
      # Включить отдельным коммитом, когда все ветки смержены.

      - name: Tests
        run: pytest -q
