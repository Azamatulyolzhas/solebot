# Конфигурация деплоя Railway (config-as-code, перекрывает настройки сервиса).
[build]
builder = "NIXPACKS"

[deploy]
# $PORT подставляет Railway; локальный фоллбэк 8000 — для ручного запуска.
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
# Запас на boot-DDL миграции и установку вебхуков при старте.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
