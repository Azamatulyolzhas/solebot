[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
# Мягкий старт: только реальные ошибки (pyflakes) и грубые нарушения pycodestyle.
select = ["E4", "E7", "E9", "F"]
# F841 — два легаси-места (routes/shop.py payload_field, telegram_bot.py fresh);
# авто-фикс для них небезопасен, уберём при ближайшем рефакторинге этих файлов.
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# Скрипт настраивает окружение до импортов приложения — это осознанно.
"create_shop_owner.py" = ["E402"]
